name: 每日 QDII 网格看板更新

# 触发条件：北京时间周一~周六 15:10 自动运行（排除周日）+ 支持手动触发
on:
  schedule:
    # GitHub Actions 的 cron 使用 UTC，北京时间 = UTC+8
    # 北京时间 15:10  ->  UTC 07:10
    # 第 5 字段为星期几：0=周日 1=周一 … 6=周六；"1-6" 表示周一至周六，排除周日
    - cron: "10 7 * * 1-6"
  workflow_dispatch:

# 赋予工作流写入仓库内容的权限
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取仓库代码
      - name: Checkout
        uses: actions/checkout@v3

      # 2. 配置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      # 3. 安装依赖（脚本依赖 requests）
      - name: Install dependencies
        run: pip install -r requirements.txt

      # 4. 运行生成脚本（输出到 docs/index.html）
      - name: Generate HTML
        run: python generate.py

      # 5. 提交并推送变更
      - name: Commit and Push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/index.html
          git commit -m "chore: update QDII dashboard [skip ci]" || exit 0
          git push
