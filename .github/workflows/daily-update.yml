name: ETF 双动量策略每日运行

on:
  schedule:
    # 北京时间每个交易日 15:10（收盘后）运行；UTC = 北京时间 -8
    # 注意：GitHub Actions 无法自动跳过休市日，但脚本只在真正调仓日才发邮件，平时静默
    - cron: '10 7 * * 1-5'
  workflow_dispatch: {}   # 允许在 Actions 页面手动触发

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install "akshare>=1.12" "pandas>=1.5" "numpy>=1.23"

      - name: 运行策略（调仓日发邮件）
        run: python etf_momentum_v2.py --email
